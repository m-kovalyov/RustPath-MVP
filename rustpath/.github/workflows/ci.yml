name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_DB: rustpath_test, POSTGRES_USER: rustpath, POSTGRES_PASSWORD: test-only }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rustpath -d rustpath_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test --locked
        working-directory: backend
      - run: cargo test --locked -- --ignored
        working-directory: backend
        env: { INTEGRATION_DATABASE_URL: "postgresql://rustpath:test-only@127.0.0.1/rustpath_test" }
      - run: npm ci && npm run build && npm test
        working-directory: frontend
      - run: python tests/check_curriculum.py
      - run: pip install -r runner/requirements.txt && python tests/test_runner.py
      # On GitHub runners, verify actual isolation and all lessons via Docker.
      - run: |
          cp .env.example .env
          sed -i 's/replace_with_64_random_hex_characters/ci-test-only/g' .env
          docker pull rust:1.99.0-slim-bookworm
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/api/health && break || sleep 2; done
          python tests/smoke.py
      - if: always()
        run: docker compose down -v
